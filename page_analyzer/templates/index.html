{% extends 'base.html' %}
{% block content %}
<main class="flex-grow w-full">
  <div class="outline outline-[2px] outline-gray-200 rounded-md max-w-xl mx-auto p-6 mt-2 bg-gray-100">
    <h1 class="text-5xl mb-2 ">Анализатор страниц</h1>
      <p class="text-gray-800 text-sm mb-2">Бесплатно проверяйте сайты на SEO-пригодность</p>
        <form action="{{ url_for('index') }}" method="post" class="flex flex-row items-center gap-3 w-full">
          <label for="url-input" class="sr-only">Url для проверки</label>
          <input type="url" name="url" id="url-input" placeholder="https://www.example.com" class="w-full rounded-md border border-gray-300 p-0.5 text-base text-left text-start shadow-sm" value="{{ request.form.url|default('') }}">
          <input type="submit" class="bg-blue-600 text-white font-medium py-1.5 px-8 rounded-md text-sm text-uppercase cursor-pointer transition-colors flex-shrink-0" value="ПРОВЕРИТЬ">
        </form>
      </div>
</main>
{% endblock%}
